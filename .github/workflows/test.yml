name: Test Suite

on: [push, pull_request]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: african_agent
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Next 16 exige Node >= 20 : le workflow tournait sur Node 18.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Le lint ne tournait que dans build.yml, donc jamais sur une PR.
      - name: Run linter
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --forceExit --coverage
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/african_agent
          REDIS_URL: redis://localhost:6379

      - name: Build
        run: npm run build

      - name: Upload coverage
        # v3 est archivée ; v5 est la version courante de l'action.
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: ./coverage/coverage-final.json
